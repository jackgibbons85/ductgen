[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ductgen"
version = "0.1.0"
description = "Parametric ducted quad frame generator for SolidWorks, with bed-aware part splitting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
solidworks = ["pywin32>=306"]

[project.scripts]
ductgen = "ductgen.cli:main"

[project.gui-scripts]
ductgen-gui = "ductgen.gui:main"

[tool.setuptools]
packages = ["ductgen"]
